name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 一致性校验
        run: python scripts/validate.py
      - name: JSON-LD 模板与生成器一致
        run: |
          python scripts/gen_schema_templates.py
          git diff --exit-code -- 'geo-playbook/resources/*.json'
